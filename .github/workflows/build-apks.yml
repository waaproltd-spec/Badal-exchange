name: Build Customer & Agent APKs

# Both apps talk to the Supabase project (SUPABASE_URL, default below) with
# its publishable/anon key (secret or variable SUPABASE_ANON_KEY).
#
# Manual-only. This sandbox's own network policy blocks dl.google.com (the
# Android SDK download host), so real APK builds have to happen on a
# GitHub-hosted runner instead, which has full internet access. Builds
# release APKs for both Flutter apps and uploads them as workflow
# artifacts to download.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Supabase settings
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the Supabase publishable (anon) key as a repository secret or variable named SUPABASE_ANON_KEY (Supabase dashboard -> Project Settings -> API Keys)."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Build customer app APK
        working-directory: customer-app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://onbezsojnpsrtuxzwsjr.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Build agent app APK
        # Independent of the customer app build -- one app's build failure
        # must not prevent uploading the other app's already-built APK.
        if: always()
        working-directory: agent-app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://onbezsojnpsrtuxzwsjr.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: badal-exchange-apks
          path: |
            customer-app/build/app/outputs/flutter-apk/app-release.apk
            agent-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Publish as a GitHub Release
        # Workflow-artifact storage (blob.core.windows.net) isn't reachable
        # from the environment that needs to fetch these files, so also
        # publish whichever APK(s) built successfully as release assets,
        # which are fetchable over plain github.com.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="apk-build-${{ github.run_id }}"
          # Both builds produce a file literally named app-release.apk --
          # `gh release upload path#label` only sets the *display label*,
          # not the underlying stored asset name (still the local
          # basename), so uploading both under that shared basename
          # silently clobbers one with the other. Copy each to a uniquely
          # named file first so they persist as two distinct assets.
          FILES=()
          if [ -f customer-app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp customer-app/build/app/outputs/flutter-apk/app-release.apk customer-app-release.apk
            FILES+=("customer-app-release.apk")
          fi
          if [ -f agent-app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp agent-app/build/app/outputs/flutter-apk/app-release.apk agent-app-release.apk
            FILES+=("agent-app-release.apk")
          fi
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No APKs were built successfully -- nothing to publish."
            exit 0
          fi
          gh release create "$TAG" \
            --title "APK build ${{ github.run_number }}" \
            --notes "Debug-signed release APKs for sideloaded testing -- not signed for Play Store publishing."
          # Uploading assets in the same command as release creation can
          # 404 if GitHub hasn't finished propagating the new release yet
          # -- upload separately with a short retry.
          for f in "${FILES[@]}"; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                break
              fi
              echo "Upload attempt $attempt for $f failed, retrying in 5s..."
              sleep 5
            done
          done
