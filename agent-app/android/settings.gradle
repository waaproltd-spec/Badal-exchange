// NOTE: This is a hand-written, minimal Android Gradle scaffold written
// without access to the Flutter SDK in this environment. Re-run
// `flutter create .` (or open in Android Studio and let it sync) in an
// SDK-equipped environment to regenerate/complete this cleanly before
// building — see agent-app's top-level notes in the PR/commit message.

pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def sdkPath = properties.getProperty("flutter.sdk")
        assert sdkPath != null, "flutter.sdk not set in local.properties"
        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
