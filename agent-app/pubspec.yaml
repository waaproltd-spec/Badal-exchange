name: badal_agent_app
description: Badal Exchange Agent app — verify EVC Plus deposits and process withdrawals.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.4.0
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1
  supabase_flutter: ^2.15.4

# supabase_flutter pulls in app_links; 6.4.1+ reads `flutter.compileSdkVersion`
# in its Android build, which needs Flutter 3.27+. The APKs build with 3.24.
dependency_overrides:
  app_links: 6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
